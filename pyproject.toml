[project]
name = "spam-remover"
version = "0.1.0"
description = "Discord bot that auto-removes spam joiners (free-giveaway/nitro scams) and notifies club officers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.4.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
spam-remover = "spam_remover.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spam_remover"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
